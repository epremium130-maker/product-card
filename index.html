<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body style="font-family: Montserrat;">
  <div class="all-elements product-card__bg">
    <header>
      <p class="main-header">Выбери свой продукт</p>
    </header>
    <div>
      <button class="color-toggle-button">Поменять цвет кнопки</button>
      <button id="recolor-first-card-button">Перекрасить первую карточку</button>
      <button id="recolor-product-cards-button">Перекрасить все карточки</button>
      <button id="open-google-button">Открыть страницу Google</button>
    </div>
  <div class="product-card__wraper">
    <template id="product-card-template">
    <div class="product-card">
      <div class="product-card__img">
        <img src="" width="290" height="245" alt="">
      </div>
      <div class="product-card__for-skin-wrapper">
        <p class="product-card__for-skin">для нормальной кожи</p>
      </div>
      <h3 class="product-card__title"></h3>
      <p class="product-card__descr"></p>
      <span class="product-card__compound-text">Состав:</span>
      <ul class="product-card__compound">
        </ul>
      <div class="product-card__price-wrap">
        <span class="product-card__price-text">Цена</span>
        <span class="product-card__price"><span class="price-value"></span> &#8381</span>
      </div>
    </div>
  </template>
  </div>
  </div>
  <script src="/script.js"></script>
  <script type="module" src="homework-7.js"></script>
  <script type="module" src="homework-8.js"></script>
</body>
</html>
